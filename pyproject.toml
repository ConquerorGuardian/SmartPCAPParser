[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-pcap-parser"
dynamic = ["version"]
description = "Фильтры Wireshark из обычных слов: анализ pcap/pcapng без tshark"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ConquerorGuardian" }]
keywords = ["pcap", "pcapng", "wireshark", "network", "traffic-analysis", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["customtkinter>=5.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.6"]
# Сборка exe: tools/build_exe.py
build = ["pyinstaller>=6.6"]
# Перерисовка иконки: tools/make_icon.py
assets = ["pillow>=10"]
# Необязательное перетаскивание файлов в окно
dnd = ["tkinterdnd2>=0.4"]

[project.scripts]
smartpcap = "main:main"

[project.urls]
Homepage = "https://github.com/ConquerorGuardian/SmartPCAPParser"
"Bug Tracker" = "https://github.com/ConquerorGuardian/SmartPCAPParser/issues"

[tool.setuptools]
py-modules = ["main"]
packages = ["parser", "gui"]

[tool.setuptools.package-data]
gui = ["*.json"]
parser = ["*.pyi"]

[tool.setuptools.dynamic]
version = { attr = "parser.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100
respect-gitignore = true

[tool.ruff.lint]
# Осознанно узкий набор: ошибки и очевидные проблемы, без вкусовщины.
# SIM/B/UP включаются постепенно, когда код к ним готов.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",     # длину строк держим под контролем глазами, включим позже
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
files = ["parser"]
exclude = ["tests", "build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
