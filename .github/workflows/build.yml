name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m tests.run_all

      - name: Build exe (single file + folder)
        run: python tools/build_exe.py --both

      - name: Self-test the packaged app
        run: |
          python tools/check_exe.py dist/SmartPCAPParser.exe dist/SmartPCAPParser/SmartPCAPParser.exe

      - name: Show checksums and sizes
        shell: pwsh
        run: |
          Get-Content dist\SHA256SUMS.txt
          Get-ChildItem dist -File | Select-Object Name, @{n="МБ";e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPCAPParser-windows-x64
          path: |
            dist/SmartPCAPParser.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SmartPCAPParser.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Как запустить

            1. Скачайте **`SmartPCAPParser.exe`** (одним файлом, ~13 МБ).
            2. Запустите — установка не нужна, Python не нужен.
            3. Откройте дамп `.pcap`/`.pcapng` кнопкой «Открыть файл» или
               перетащите файл на `SmartPCAPParser.exe`.

            SmartScreen может спросить подтверждение: exe не подписан
            сертификатом — это обычное поведение для небольших открытых
            проектов. Проверить сборку можно так:
            `SmartPCAPParser.exe --selftest`.

            Если антивирус или корпоративная политика не дают запускать
            один файл, скачайте `SmartPCAPParser-<версия>-windows-x64.zip`
            — это та же программа папкой.

            Целостность файлов — в `SHA256SUMS.txt`.
