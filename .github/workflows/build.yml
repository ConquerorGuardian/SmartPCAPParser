name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m tests.run_all

      - name: Build exe
        run: python tools/build_exe.py

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $exe = "dist\SmartPCAPParser\SmartPCAPParser.exe"
          if (-not (Test-Path $exe)) { throw "exe не собран: $exe" }
          & $exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest упал с кодом $LASTEXITCODE" }
          $report = Join-Path $env:TEMP "smartpcap_selftest.txt"
          if (Test-Path $report) { Get-Content $report }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPCAPParser-windows-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
