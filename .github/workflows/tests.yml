name: tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    # Приложение живёт на Windows, поэтому тесты гоняются на обеих системах:
    # на Ubuntu GUI-тесты пропускаются без дисплея, на Windows идут целиком.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tk and Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m tests.run_all 2>&1 | Tee-Object -FilePath test-output.txt
          exit $LASTEXITCODE

      - name: Tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          xvfb-run -a python -m tests.run_all 2>&1 | tee test-output.txt

      - name: Save test log on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path test-output.txt) { Copy-Item test-output.txt ci-log.txt }
          else { "нет вывода тестов" | Set-Content ci-log.txt }
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B "ci-log-${{ github.run_id }}"
          git add -f ci-log.txt
          git commit -m "log ${{ github.run_id }}"
          git push origin "ci-log-${{ github.run_id }}"

      - name: Type check (advisory)
        continue-on-error: true
        run: mypy parser
